name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: vklass/pyproject.toml
      - run: pip install -e './vklass[test]'
      - run: python -m pytest
        working-directory: vklass

  library-in-sync:
    # The component ships a copy of the library; fail if it was not regenerated.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync_lib.sh
      - run: git diff --exit-code -- custom_components/vklass/vklass_api
